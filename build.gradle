plugins {
	id "java"
}

// ==================== 构建产物命名 ====================
// 版本号取自 src/main/resources/paper-plugin.yml 的 version 字段（唯一来源，改那里即可）
def pluginVersion = {
	def yml = layout.projectDirectory.file('src/main/resources/paper-plugin.yml').asFile
	if (!yml.exists()) {
		return '0.0.0'
	}
	def matcher = yml.getText('UTF-8') =~ /(?m)^version:\s*(\S+)/
	return matcher.find() ? matcher.group(1) : '0.0.0'
}()

// 构建次数持久化在项目根目录的 build-number.txt，每次产出 jar 自增 1
def buildNumberFile = layout.projectDirectory.file('build-number.txt').asFile
def storedBuildNumber = 0
if (buildNumberFile.exists()) {
	def text = buildNumberFile.getText('UTF-8').trim()
	if (text.isInteger()) {
		storedBuildNumber = text as int
	}
}
def buildNumber = storedBuildNumber + 1

base.archivesName = "MeteorFuck_v${pluginVersion}-build.${buildNumber}"

repositories {
	mavenCentral()
	maven {
		name = "papermc"
		url = "https://repo.papermc.io/repository/maven-public/"
	}
}

dependencies {
	compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
}


def javaVersion = JavaVersion.VERSION_25

java {
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
	toolchain.languageVersion = JavaLanguageVersion.of(javaVersion.toString())
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.release = javaVersion.toString() as Integer
}

/**
 * 每产出一次 jar，就把本次构建次数写回 build-number.txt。
 * 不放在 configuration 阶段写，否则跑 gradlew tasks 这种命令也会把次数吃掉。
 */
tasks.register('bumpBuildNumber') {
	group 'build'
	description '递增构建次数（写入 build-number.txt）'

	doLast {
		buildNumberFile.setText(buildNumber.toString(), 'UTF-8')
	}
}

// jar / sourcesJar 都依赖它；同一任务只会执行一次，所以一次构建只 +1
tasks.withType(Jar).configureEach {
	dependsOn tasks.bumpBuildNumber
}

processResources {
	def props = [version: version]
	inputs.properties props
	filteringCharset 'UTF-8'
	filesMatching('plugin.yml') {
		expand props
	}
}

apply from: 'e.gradle'